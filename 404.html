      * {

      html,

      body {

      #root-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a1628;
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.65, 0, 0.35, 1), visibility 0.6s;
      }
      #root-loader.is-leaving {
        opacity: 0;
        visibility: hidden;
      }

      /* Ambient layered background */
      .ambient {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .ambient::before,
      .ambient::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
      }
      .ambient::before {
        width: 520px;
        height: 520px;
        left: 22%;
        top: 58%;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(34, 197, 94, 0.22) 0%,
          transparent 70%
        );
        animation: drift-a 14s ease-in-out infinite;
      }
      .ambient::after {
        width: 460px;
        height: 460px;
        left: 76%;
        top: 28%;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(57, 231, 228, 0.14) 0%,
          transparent 70%
        );
        animation: drift-b 18s ease-in-out infinite;
      }

      /* Grid overlay */
      .grid-screen {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px

          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );
        background-size: 56px 56px;
        mask-image: radial-gradient(
          ellipse at center,
          #000 0%,
          transparent 70%
        );
        -webkit-mask-image: radial-gradient(
          ellipse at center,
          #000 0%,
          transparent 70%
        );
      }

      /* Noise */
      .noise {
        position: absolute;
        inset: 0;
        opacity: 0.035;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* Stage */
      .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
      }

      /* Logo capsule */
      .logo-wrap {
        position: relative;
        width: 132px;
        height: 132px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Orbital rings */
      .orbit {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(126, 237, 162, 0.12);
      }
      .orbit.r1 {
        inset: -12px;
        animation: rotate 12s linear infinite;
      }
      .orbit.r2 {
        inset: -28px;
        border-style: dashed;
        border-color: rgba(57, 231, 228, 0.08);
        animation: rotate 20s linear infinite reverse;
      }
      .orbit .dot {
        position: absolute;
        top: -3px;
        left: 50%;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #7eeda2;
        box-shadow: 0 0 14px rgba(126, 237, 162, 0.8);
        transform: translateX(-50%);
      }
      .orbit.r2 .dot {
        background: #39e7e4;
        box-shadow: 0 0 14px rgba(57, 231, 228, 0.7);
      }

      /* Halo pulse */
      .halo {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(34, 197, 94, 0.35) 0%,
          transparent 65%
        );
        filter: blur(18px);
        animation: halo-pulse 2.6s ease-in-out infinite;
        opacity: 0.85;
      }

      /* Logo SVG */
      .logo-svg {
        position: relative;
        width: 72px;
        height: auto;
        opacity: 0;
        transform: scale(0.85);
        animation: logo-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;

      .logo-svg path:nth-child(2) {

      /* Wordmark */
      .wordmark {

      }
      .title {

      .corner {

        height: 22px;
        border-color: rgba(255, 255, 255, 0.18);

      .corner.tr {

        right: 28px;
        border-top: 1px solid;
        border-right: 1px solid;
      }
      .corner.bl {
        bottom: 28px;
        left: 28px;
        border-bottom: 1px solid;
        border-left: 1px solid;
      }
      .corner.br {
        bottom: 28px;
        right: 28px;
        border-bottom: 1px solid;
        border-right: 1px solid;
      }

      .version {
        position: absolute;
        top: 30px;
        right: 56px;
        font-size: 10px;
        letter-spacing: 0.3em;
        color: rgba(255, 255, 255, 0.3);
        font-variant-numeric: tabular-nums;
      }
      .build {
        position: absolute;
        top: 30px;
        left: 56px;
        font-size: 10px;
        letter-spacing: 0.3em;
        color: rgba(255, 255, 255, 0.3);
        font-variant-numeric: tabular-nums;
      }

      /* Animations */
      @keyframes rotate {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes halo-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }
      @keyframes logo-in {
        to {

          transform: scale(1);
        }
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes letter-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fade-up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes load {
        0% {
          transform: translateX(-100%);
          width: 30%;
        }
        50% {
          width: 55%;
        }
        100% {
          transform: translateX(400%);
          width: 30%;
        }
      }
      @keyframes dot-pulse {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }
      @keyframes drift-a {

      }

      @media (max-width: 480px) {
        .logo-wrap {
          width: 108px;
          height: 108px;
        }
        .logo-svg {
          width: 58px;
        }
        .title {
          font-size: 18px;
          letter-spacing: 0.36em;
        }
        .progress {
          width: 180px;
        }
        .version,
        .build {
          font-size: 9px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .orbit,
        .halo,
        .ambient::before,
        .ambient::after,

        .caption .pulse {

        }
        .logo-svg {
          opacity: 1;
          transform: none;
          animation: none;
        }
        .logo-svg path {
          stroke-dashoffset: 0;
          animation: none;
        }
        .title span,
        .tagline,
        .progress,
        .caption {
          opacity: 1;
          transform: none;
          animation: none;
        }
      }
